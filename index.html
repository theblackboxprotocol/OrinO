<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrinO — AI Prompt Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Banner Logo -->
<header>
    <div class="banner-container">
        <img src="OrinOBanner.webp" alt="OrinO AI Studio Banner">
    </div>
</header>
    <!-- Main Content -->
    <main class="main-container">

        <!-- Prompt -->
        <section class="glass-box prompt-section">

            <div class="box-header">

                <h3>Prompt</h3>

                <div class="box-actions">

                    <button class="icon-btn" title="Random Prompt">
                        <img src="dice_glass_transparent.png" alt="Random Prompt">
                    </button>

                    <button class="icon-btn" title="AI Prompt Builder">
                        <img src="thought_bubble_fog_transparent.png" alt="AI Prompt Builder">
                    </button>

                </div>

            </div>

            <textarea
                placeholder="Describe your image in as much detail as possible..."></textarea>

        </section>

        <!-- Negative Prompt -->
        <section class="glass-box prompt-section">

            <div class="box-header">

                <h3>Negative Prompt</h3>

                <div class="box-actions">

                    <button class="icon-btn" title="Random Negative Prompt">
                        <img src="dice_glass_transparent.png" alt="Random Negative Prompt">
                    </button>

                    <button class="icon-btn" title="Negative Prompt Builder">
                        <img src="thought_bubble_fog_transparent.png" alt="Negative Prompt Builder">
                    </button>

                </div>

            </div>

            <textarea
                placeholder="Describe everything you want the AI to avoid..."></textarea>

        </section>
                <!-- Advanced Style Controls -->
        <section class="advanced-controls glass-box">

            <div class="style-row">

                <!-- Shape of Image -->
                <div class="style-control">
                    <label>Shape of Image</label>

                    <select id="image-shape">
                        <option>Portrait</option>
                        <option>Square</option>
                        <option>Landscape</option>
                    </select>
                </div>


                <!-- Guidance Scale -->
                <div class="style-control">
                    <label>Guidance Scale</label>

                    <select id="guidance-scale">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option selected>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                    </select>
                </div>

            </div>


        <!-- Art Styles -->
<div class="style-row">

    <div class="style-control">
        <label>Art Style 1</label>
        <select id="style-1">
            <option selected>Loading styles...</option>
        </select>
    </div>


    <div class="style-control">
        <label>Art Style 2</label>
        <select id="style-2">
            <option selected>Loading styles...</option>
        </select>
    </div>


    <div class="style-control">
        <label>Art Style 3</label>
        <select id="style-3">
            <option selected>Loading styles...</option>
        </select>
    </div>

</div>
            <!-- Cinematic Dynamic Tools -->
            <div id="prompt-tools" class="cinematic-tools">


                <select id="shot-menu">
                    <option>Add Shot</option>
                    <option>Extreme Close Up</option>
                    <option>Low Angle</option>
                    <option>High Angle</option>
                    <option>Aerial</option>
                    <option>Close Up</option>
                    <option>Portrait</option>
                    <option>Macro</option>
                    <option>Wide Angle</option>
                    <option>Establishing</option>
                    <option>Over The Shoulder</option>
                    <option>Handheld</option>
                    <option>Panoramic</option>
                    <option>Dramatic</option>
                </select>


                <select id="effect-menu">
                    <option>Add Effect</option>
                    <option>Bokeh</option>
                    <option>Tilt Shift</option>
                    <option>Soft Focus</option>
                    <option>Background Blur</option>
                    <option>Chromatic Aberration</option>
                    <option>Light Leaks</option>
                    <option>Lens Flare</option>
                    <option>Long Exposure</option>
                    <option>Golden Hour</option>
                    <option>Silhouette</option>
                </select>


                <select id="color-menu">
                    <option>Add Colors</option>
                    <option>Vibrant</option>
                    <option>Warm</option>
                    <option>Cool</option>
                    <option>Pastel</option>
                    <option>Bright</option>
                    <option>Muted</option>
                    <option>Neon</option>
                    <option>Duotone</option>
                    <option>Monochrome</option>
                    <option>Sterile</option>
                </select>


                <select id="genre-menu">
                    <option>Add Genre</option>
                    <option>Adventure</option>
                    <option>B-Horror</option>
                    <option>Epic Fantasy</option>
                    <option>Sci-Fi</option>
                    <option>Film Noir</option>
                    <option>Horror</option>
                    <option>Indie</option>
                    <option>Western</option>
                    <option>Thriller</option>
                </select>


            </div>


        </section>

        <!-- Bottom Controls -->
        <section class="controls">

            <div class="control-group">

                <label for="image-count">Images</label>

                <select id="image-count">

                    <option selected>3</option>
                    <option>5</option>
                    <option>10</option>
                    <option>30</option>
                    <option>60</option>

                </select>

            </div>

            <div class="control-group">

                <label for="seed">Seed</label>

                <select id="seed">

                    <option selected>Random</option>

                </select>

            </div>

        </section>

    </main>
<script src="ArtStyles.js"></script>
<script src="script.js"></script>
</body>

</html>
