<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrinO — AI Prompt Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Logo -->
    <header>
        <div class="logo-container">
            <img src="768310404_1066594275826466_3764743712480842575_n.gif" alt="OrinO Logo">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">

        <!-- Prompt -->
        <section class="glass-box prompt-section">

            <div class="box-header">

                <h3>Prompt</h3>

                <div class="box-actions">

                    <button class="icon-btn" title="Random Prompt">
                        <img src="dice_glass_transparent.png" alt="Random Prompt">
                    </button>

                    <button class="icon-btn" title="AI Prompt Builder">
                        <img src="thought_bubble_fog_transparent.png" alt="AI Prompt Builder">
                    </button>

                </div>

            </div>

            <textarea
                placeholder="Describe your image in as much detail as possible..."></textarea>

        </section>

        <!-- Negative Prompt -->
        <section class="glass-box prompt-section">

            <div class="box-header">

                <h3>Negative Prompt</h3>

                <div class="box-actions">

                    <button class="icon-btn" title="Random Negative Prompt">
                        <img src="dice_glass_transparent.png" alt="Random Negative Prompt">
                    </button>

                    <button class="icon-btn" title="Negative Prompt Builder">
                        <img src="thought_bubble_fog_transparent.png" alt="Negative Prompt Builder">
                    </button>

                </div>

            </div>

            <textarea
                placeholder="Describe everything you want the AI to avoid..."></textarea>

        </section>

        <!-- Bottom Controls -->
        <section class="controls">

            <div class="control-group">

                <label for="image-count">Images</label>

                <select id="image-count">

                    <option selected>3</option>
                    <option>5</option>
                    <option>10</option>
                    <option>30</option>
                    <option>60</option>

                </select>

            </div>

            <div class="control-group">

                <label for="seed">Seed</label>

                <select id="seed">

                    <option selected>Random</option>

                </select>

            </div>

        </section>

    </main>

</body>

</html>
