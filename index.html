<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnirO — Generative Prompt Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête Logo Animé -->
    <header>
        <div class="logo-container">
            <img src="768310404_1066594275826466_3764743712480842575_n.gif" alt="OnirO Logo">
        </div>
    </header>

    <!-- Contenu Principal -->
    <div class="main-container">
        
        <!-- Boîte de Prompt Principal -->
        <div class="glass-box prompt-section">
            <div class="box-header">
                <h3>PROMPT PRINCIPAL</h3>
                <div class="box-actions">
                    <button class="icon-btn" title="Random Prompt">
                        <img src="dice_glass_transparent.png" alt="Dé">
                    </button>
                    <button class="icon-btn" title="Auto Prompt">
                        <img src="thought_bubble_fog_transparent.png" alt="Cerveau/Bulle">
                    </button>
                </div>
            </div>
            <textarea placeholder="Décrivez votre vision, style ou scène onirique..."></textarea>
        </div>

        <!-- Boîte d'Anti-Prompt / Exclusions -->
        <div class="glass-box prompt-section">
            <div class="box-header">
                <h3>ANTI-PROMPT / EXCLUSIONS</h3>
                <div class="box-actions">
                    <button class="icon-btn" title="Random Anti-Prompt">
                        <img src="dice_glass_transparent.png" alt="Dé">
                    </button>
                    <button class="icon-btn" title="Auto Anti-Prompt">
                        <img src="thought_bubble_fog_transparent.png" alt="Cerveau/Bulle">
                    </button>
                </div>
            </div>
            <textarea placeholder="Éléments à éviter (flou, déformations, texte indésirable)..."></textarea>
        </div>

        <!-- Boutons du bas (Nettoyer, Copier, Favoris) -->
        <div class="custom-buttons">
            <button class="btn-custom">Nettoyer</button>
            <button class="btn-custom">Copier</button>
            <button class="btn-custom">Favoris</button>
        </div>

    </div>

</body>
</html>
