<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnirO — Generative Prompt Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Espace Réservé pour la Publicité -->
    <div id="ad-banner">
        <span>[ Zone Publicitaire / Banner Ad ]</span>
    </div>

    <!-- En-tête Logo Animé -->
    <header>
        <div class="logo-container">
            <img src="1000040609_2.gif" alt="OnirO Logo">
        </div>
    </header>

    <!-- Contenu Principal -->
    <div class="main-container">
        
        <!-- Boîte de Prompt -->
        <div class="glass-box prompt-section">
            <h3>PROMPT PRINCIPAL</h3>
            <textarea placeholder="Décrivez votre vision, style ou scène onirique..."></textarea>
        </div>

        <!-- Boîte d'Anti-Prompt -->
        <div class="glass-box prompt-section">
            <h3>ANTI-PROMPT / EXCLUSIONS</h3>
            <textarea placeholder="Éléments à éviter (flou, déformations, texte indésirable)..."></textarea>
        </div>

        <!-- Barre d'action avec le Dé et la Bulle -->
        <div class="action-bar">
            <!-- Bouton Dé -->
            <button class="dice-btn" title="Générer aléatoirement">
                <img src="1000040619_2.png" alt="Dé OnirO">
            </button>

            <!-- Zone Bulle de pensée + Boutons -->
            <div class="controls-right">
                <div class="thought-container">
                    <img src="1000040620_2.png" alt="Bulle de pensée" class="thought-bg">
                    <div class="thought-content">
                        ✨ Façonnez l'onirique...
                    </div>
                </div>
                <div class="custom-buttons">
                    <button class="btn-custom">Nettoyer</button>
                    <button class="btn-custom">Copier</button>
                    <button class="btn-custom">Favoris</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
